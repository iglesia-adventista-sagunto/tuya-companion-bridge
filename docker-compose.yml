services:
  tuya-companion-bridge:
    build: .
    container_name: tuya-companion-bridge
    restart: unless-stopped
    ports:
      - "5000:5000"
      # Expose Tuya UDP broadcast discovery ports (protocol 3.1 & 3.3/3.4/3.5)
      - "6666:6666/udp"
      - "6667:6667/udp"
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/config.json
    # Note: On Linux, 'network_mode: host' is recommended so UDP broadcast packets
    # from the local LAN reach the container without NAT/bridge forwarding issues.
    # network_mode: host
